[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "output-contracts"
version = "0.1.0"
description = "Validate output against explicit portable contracts."
requires-python = ">=3.11"
authors = [{name = "Anuj Sadani"}]
readme = "README.md"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
output-contracts = "output_contracts.__main__:main"

[tool.setuptools.packages.find]
include = ["output_contracts*"]
